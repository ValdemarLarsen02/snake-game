<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Snake — Grid / Queue implementation</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main>
    <h1>Snake — with my queue package</h1>

    <section id="info">
      <h2>How to play</h2>
      <p>
        Control the snake using the keyboard:
      </p>
      <ul>
        <li><strong>Arrow Up</strong> – Move up</li>
        <li><strong>Arrow Down</strong> – Move down</li>
        <li><strong>Arrow Left</strong> – Move left</li>
        <li><strong>Arrow Right</strong> – Move right</li>
      </ul>
      <p>
        Eat food to grow. Avoid hitting your own body.  
        Good luck!
      </p>
    </section>

    <canvas id="game"></canvas>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
